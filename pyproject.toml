[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparqlmodel"
version = "0.2.0"
description = "SPARQL ORM for Python — sessions, queries, and graph persistence on RDF stores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SparqlModel Contributors" }]
keywords = ["sparql", "rdf", "orm", "sparql-orm", "session", "pydantic", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database :: Front-Ends",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5,<3",
    "rdflib>=7.0,<8",
    "triplemodel>=0.9.0,<2",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]
fastapi = ["fastapi>=0.100", "httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ty>=0.0.37",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.100",
]
docs = [
    "sphinx>=7.0,<9",
    "sphinx-rtd-theme>=2.0,<4",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-design>=0.6,<1",
    "myst-parser>=3.0,<5",
    "httpx>=0.27",
    "fastapi>=0.100",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/sqarqlmodel"
Repository = "https://github.com/eddiethedean/sqarqlmodel"
Documentation = "https://sparqlmodel.readthedocs.io/en/latest/"
Changelog = "https://github.com/eddiethedean/sqarqlmodel/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sparqlmodel"]

[tool.hatch.build.targets.sdist]
include = ["src/sparqlmodel", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:green-light"
filterwarnings = [
    "ignore:.*async fixture 'ensure_greenlet_context'.*:pytest.PytestRemovedIn9Warning",
]

[tool.coverage.run]
source = ["sparqlmodel"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/sparqlmodel/expressions.py" = ["UP042"]
"src/sparqlmodel/model.py" = ["E501"]
"src/sparqlmodel/graph.py" = ["E501"]
"tests/test_fastapi_extra.py" = ["E402"]
"tests/test_coverage.py" = ["SIM117", "B017"]

[tool.ty]
# Type-check library source only (tests use query DSL patterns ty cannot verify).

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
root = ["./src"]

[tool.ty.analysis]
# rdflib ships without complete type information
replace-imports-with-any = ["rdflib.**"]
