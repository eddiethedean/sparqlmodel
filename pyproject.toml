[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparqlmodel"
version = "0.1.4"
description = "SPARQL-native object graph mapper for RDF triple stores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SparqlModel Contributors" }]
keywords = ["sparql", "rdf", "orm", "pydantic", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "rdflib>=7.0",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ty>=0.0.37",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/odosmatthews/sparqlmodel"
Repository = "https://github.com/odosmatthews/sparqlmodel"
Documentation = "https://github.com/odosmatthews/sparqlmodel#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/sparqlmodel"]

[tool.hatch.build.targets.sdist]
include = ["src/sparqlmodel", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:green-light"

[tool.coverage.run]
source = ["sparqlmodel"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/sparqlmodel/expressions.py" = ["UP042"]

[tool.ty]
# Type-check library source only (tests use query DSL patterns ty cannot verify).

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
root = ["./src"]

[tool.ty.analysis]
# rdflib ships without complete type information
replace-imports-with-any = ["rdflib.**"]
